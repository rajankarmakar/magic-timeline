name: Security Review

permissions:
  pull-requests: write # needed for the action to leave PR comments
  contents: read

# Anthropic's claude-code-security-review action only performs analysis on
# pull_request events (it diffs against the PR base) — it explicitly no-ops
# on any other event type. Since main is protected and every change lands
# via a PR, this still covers every push in practice: opening a PR triggers
# it, and every subsequent push to that PR branch re-triggers it too
# (GitHub's default "synchronize" activity type for pull_request).
on:
  pull_request:
    branches: [main]

jobs:
  security-review:
    name: Security Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Run Claude Code security review
        uses: anthropics/claude-code-security-review@main
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The action otherwise caches "already scanned this PR" per PR
          # number (not per-commit) and skips re-running on later pushes —
          # which would silently defeat "review runs on every push." Forcing
          # it here trades that for the documented risk of slightly more
          # false positives on PRs with many commits.
          run-every-commit: true

      - name: Block merge on high-severity findings
        run: |
          if [ ! -f findings.json ]; then
            echo "No findings.json produced (scan skipped or zero findings)."
            exit 0
          fi

          HIGH_COUNT=$(jq '[.[] | select(.severity == "HIGH")] | length' findings.json)
          echo "High-severity findings: $HIGH_COUNT"

          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "::error::$HIGH_COUNT high-severity security finding(s) detected — see the PR comment for details."
            exit 1
          fi
